<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Ride Update Preferences | MVBRI</title><link rel="icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="stylesheet" href="/assets/branding.css"><style>body{margin:0;background:#101010;color:#f6f3ed;font:16px/1.6 Arial,sans-serif}main{max-width:560px;margin:40px auto;padding:28px;background:#191919;border:1px solid #51452e}h1{font:32px Georgia,serif}select,button{width:100%;padding:13px;margin:12px 0;font:inherit}button{background:#c8a96b;border:0;cursor:pointer}a{color:#c8a96b}p{color:#c7c1b6}.sms-consent{color:#f6f3ed}</style></head><body><main><img class="brand-logo customer-logo" src="/assets/mvbri-logo.png" alt="MVBRI" width="192" height="128"><h1>Ride update preferences</h1><p>Choose how you want updates about this ride. Changing this preference does not cancel your booking.</p><form id="preferenceForm" hidden><label for="channel">Update method</label><select id="channel"><option value="none">No automated updates</option><option value="email">Email</option><option value="sms">Text message</option></select><div id="consentWrap" hidden><label class="sms-consent"><input id="consent" type="checkbox">I agree to receive MVBRI texts about this ride, quotes, payments, and post-ride receipt/optional tip links. Message frequency varies. Message and data rates may apply. Reply STOP to opt out or HELP for help. Consent is not required to request a ride.</label></div><button type="submit">Save update preference</button></form><p id="status" role="status" aria-live="polite">Loading your preference…</p><p><a href="/privacy.html">Privacy</a> · <a href="/messaging-terms.html">Messaging terms</a> · <a href="/">MVBRI home</a></p></main><script type="module">
const params=new URLSearchParams(location.search),reference=params.get('ref'),token=params.get('token');
const form=document.getElementById('preferenceForm'),channel=document.getElementById('channel'),consent=document.getElementById('consent'),status=document.getElementById('status');
channel.addEventListener('change',()=>{const sms=channel.value==='sms';document.getElementById('consentWrap').hidden=!sms;consent.required=sms;consent.checked=false;});
try{const [p,o]=await Promise.all([fetch('/api/contact-preference?ref='+encodeURIComponent(reference||'')+'&token='+encodeURIComponent(token||''),{cache:'no-store'}),fetch('/api/communication-options',{cache:'no-store'})]);const data=await p.json(),options=await o.json();if(!p.ok)throw new Error(data.error||'This preference link is unavailable.');channel.value=data.channel;channel.querySelector('[value="email"]').disabled=!options.emailAvailable;channel.querySelector('[value="sms"]').disabled=!options.smsAvailable;form.hidden=false;channel.dispatchEvent(new Event('change'));status.textContent='Your current preference is shown above.';}catch(error){status.textContent=error.message;}
form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/contact-preference',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference,token,contactPreference:channel.value,smsConsent:consent.checked})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not save your preference.');status.textContent='Your ride update preference is saved.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
