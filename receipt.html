<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Your Receipt | MVBRI</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="stylesheet" href="/assets/branding.css"><link rel="stylesheet" href="/assets/postride.css"></head><body><main class="card"><img class="brand-logo" src="/assets/mvbri-logo.png" alt="MVBRI" width="192" height="128"><div class="eyebrow">Thank you for riding with MVBRI</div><h1>Your ride receipt</h1><div id="testNotice" class="hidden">Test receipt — no real payment.</div><p id="status" class="status" role="status" aria-live="polite">Loading your private receipt…</p><div id="receipt" class="hidden"><p id="reference"></p><div class="rows" id="amounts"></div><p id="paidAt" class="muted"></p><p>Gratuities are optional. Thank you for choosing MVBRI.</p><a class="btn" id="tipLink">Leave an optional tip</a><button class="btn ghost" id="printReceipt" type="button">Print receipt</button></div><p class="muted">MVBRI · Houston, Texas<br>(346) 557-5796 · mvbriofficial@gmail.com</p><a class="back" href="/">Return to MVBRI</a></main><script>
const statusBox=document.getElementById('status');
document.getElementById('printReceipt').addEventListener('click',()=>window.print());
(async()=>{try{
 const params=new URLSearchParams(location.search),response=await fetch('/api/ride-receipt?'+new URLSearchParams({ref:params.get('ref')||'',token:params.get('token')||''}),{cache:'no-store',referrerPolicy:'no-referrer'}),data=await response.json();if(!response.ok)throw new Error(data.error||'Receipt unavailable.');
 document.getElementById('reference').textContent=data.bookingReference+' · Ride date: '+data.rideDate;
 const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v),rows=document.getElementById('amounts');
 for(const [label,value] of [['Ride fare',data.fare],['Deposit paid',data.deposit],['Remaining balance paid',data.balancePaid],['Fare balance due',0],...(data.tip?.status==='paid'?[['Optional tip paid',data.tip.amount]]:[])]){const row=document.createElement('div');row.className='row'+(label==='Ride fare'?' total':'');const title=document.createElement('span'),amount=document.createElement('strong');title.textContent=label;amount.textContent=money(value);row.append(title,amount);rows.append(row);}
 document.getElementById('paidAt').textContent='Fare payment verified'+(data.paidAt?' · '+new Date(data.paidAt).toLocaleString('en-US',{timeZone:'America/Chicago'})+' Central Time':'')+'.';
 const link=new URL(data.tipUrl);if(link.protocol!=='https:'||!['www.mvbri.com','mvbri.com','private-driver-website.pages.dev','mvbri-private-upgrades-20261.private-driver-website.pages.dev'].includes(link.hostname))throw new Error('Optional tip link unavailable.');document.getElementById('tipLink').href=link.pathname+link.search;
 document.getElementById('testNotice').classList.toggle('hidden',data.environment!=='sandbox');document.getElementById('receipt').classList.remove('hidden');statusBox.textContent='Paid in full';
}catch(error){statusBox.textContent=error.message;}})();
</script></body></html>
